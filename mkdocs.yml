site_name: Formazione tecnica - Edge N / N+
site_url: https://github.com/ivanrobuschi-custom/corso-tecnico-edge-n.git
site_author: Ivan Robuschi
theme:
  name: material
  logo: assets/icons/logo.png
  favicon: assets/icons/favicon.png
  language: it
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.prune
    - navigation.indexes
    # - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer

  palette:
    primary: blue grey

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - tags

copyright: Copyright Custom S.p.A 2026


nav:
  - Serie Edge: index.md
  - Infrastruttura Hardware:
      - Edge N+: hardware.md
      - Edge N: hardwareedgen.md
      - Connessioni di rete: 
        - Schema connessione interna: schemadiconnessione.md
        - Metodi di connessione ad internet: 
          - Connessione Ethernet: connessione_eth.md
          - Connessione WiFi: connessione_wifi.md
          - Connessione Sim dati: simdati.md
  - Normativa RT:
      - XML7 Ver 11.1: normativa11.md
      - XML7 Ver 11.2: normativa11_2.md
      - Chiusure ore 24: chiusuragiornaliera.md
      - Periodo d'inattività: periodoinattivita.md
      - Sigillo Fiscale Digitale: tamper.md
  - Procedure Telematiche:
      - Messa in servizio: prefmessa.md
      - Disattivazione: disattivazione.md
      - Dismissione: dismissione.md
      - Verifica periodica: 
          - Normativa vp: verifiap.md
          - Procedura vp: proceduravp.md
  - Pagamento NFC integrato: softpos.md          
  - Troubleshooting:
      - trouble.md
      - Reset 1: reset1.md
      - Disallineamenti Ade:
          - disallineamento.md
          - Errore Xml 409: errore409.md
#  - Configurazione KeepUp Smart:

   
