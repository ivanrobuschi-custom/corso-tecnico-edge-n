        /* HEADER ABBASSATO E PULITO */
        header {
            position: absolute;
            top: 150px; /* Abbassato per non coprire il logo in alto a sx */
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            color: white; 
            letter-spacing: 1px;
            /* Rimossa ombreggiatura pesante */
            font-weight: normal; 
        }

        h2 {
            margin: 5px 0 0 0;
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }

        /* CARD SCENE - SPOSTATA PIU IN BASSO */
        .scene {
            width: 90%;
            max-width: 600px;
            height: 320px;
            perspective: 1000px;
            margin-top: 260px; /* Spazio per l'header abbassato */
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); /* Ombra leggera e diffusa */
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.25rem;
            color: var(--text-dark);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .face-front {
            border-top: 6px solid var(--primary);
        }

        .face-back {
            transform: rotateY(180deg);
            border-bottom: 6px solid var(--text-dark);
            background-color: #fcfcfc;
        }

        .label {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            font-weight: 600;
        }

        /* CONTROLLI MINIMAL */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .progress {
            margin-top: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        .footer {
            position: absolute;
            bottom: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
