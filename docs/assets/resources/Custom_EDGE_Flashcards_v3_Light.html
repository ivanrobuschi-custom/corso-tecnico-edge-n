        /* HEADER ABBASSATO E PULITO */
        header {
            position: absolute;
            top: 150px; /* Abbassato per non coprire il logo in alto a sx */
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            color: white; 
            letter-spacing: 1px;
            /* Rimossa ombreggiatura pesante */
            font-weight: normal; 
        }

        h2 {
            margin: 5px 0 0 0;
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }

        /* CARD SCENE - SPOSTATA PIU IN BASSO */
        .scene {
            width: 90%;
            max-width: 600px;
            height: 320px;
            perspective: 1000px;
            margin-top: 260px; /* Spazio per l'header abbassato */
        }

        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); /* Ombra leggera e diffusa */
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1.25rem;
            color: var(--text-dark);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .face-front {

        let idx = 0;
        
        const card = document.querySelector('.card');
        const qBox = document.getElementById('q-text');
        const aBox = document.getElementById('a-text');
        const cIdx = document.getElementById('cur-idx');
        const tIdx = document.getElementById('tot-idx');

        function update() {
            card.classList.remove('is-flipped');
            
            // Piccolo ritardo per permettere l'animazione di ritorno se girata
            setTimeout(() => {
                if(data.length > 0) {
                    qBox.innerHTML = data[idx].front;
                    aBox.innerHTML = data[idx].back;
                    cIdx.innerText = idx + 1;
                    tIdx.innerText = data.length;
                }
            }, 150);
        }

        document.getElementById('btn-flip').onclick = () => card.classList.toggle('is-flipped');
        document.querySelector('.card').onclick = () => card.classList.toggle('is-flipped');

        document.getElementById('btn-next').onclick = () => {
            if(idx < data.length - 1) { idx++; update(); }
            else { alert('Training completato!'); idx = 0; update(); }
        };

        document.getElementById('btn-prev').onclick = () => {
            if(idx > 0) { idx--; update(); }
        };

        // Avvio
        update();
